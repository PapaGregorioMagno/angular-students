@for (item of students; track $index) {

    <p  
       // [ngStyle]="{'backgroundColor' : item.gender == 'f' ? F_COLOR : M_COLOR}"
       //[ngClass]="{'absent' : !item.present}"
        [ngStyle]="getstyle(item)">

        {{$index + 1}} {{item.name}} {{item.city}}
        @if (item.present) {
            <span> presente</span>
        } @else {
            <span style="text-transform: uppercase;"> assente</span>
        }

    
    </p>
}
